services:
  - type: web
    name: api-java-spring-boot
    runtime: docker
    plan: free
    healthCheckPath: /clientes
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clientes-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: clientes-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: clientes-db
          property: password

databases:
  - name: clientes-db
    plan: free
    databaseName: clientes_db
